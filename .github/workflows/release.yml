name: Release

# Se ejecuta al subir un tag de versión, p.ej. v0.1.1
on:
  push:
    tags:
      - "v*"

# Necesario para que GITHUB_TOKEN pueda crear la release (subir los artefactos)
permissions:
  contents: write

jobs:
  release-mac:
    # Fijado a macos-15 (Apple Silicon): macos-latest pasó a macOS 26 y
    # electron-builder 24 falla ahí al firmar (set-key-partition-list).
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build & publish (macOS)
        run: npm run release
        env:
          # Publicación en GitHub Releases
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma de código (certificado "Developer ID Application" en base64)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Notarización con Apple
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Plugin de WordPress: se adjunta a la misma release (borrador) que acaba de crear
      # electron-builder. La app lo descarga desde .../releases/latest/download/engineer-cf7-importer.zip
      - name: Attach WordPress plugin
        run: |
          cd wp-plugin
          zip -r ../engineer-cf7-importer.zip engineer-cf7-importer -x "*.DS_Store"
          cd ..
          gh release upload "$GITHUB_REF_NAME" engineer-cf7-importer.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # Windows: instalador NSIS x64 (sin firma de código → SmartScreen
  # avisa en el primer install). Corre después de Mac para que ambos
  # suban a la MISMA release borrador y no se creen dos.
  # ------------------------------------------------------------------
  release-win:
    needs: release-mac
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build & publish (Windows)
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
